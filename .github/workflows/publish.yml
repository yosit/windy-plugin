name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke gate
        run: bun run smoke

      - name: Verify all workspace versions match before bump
        run: |
          ROOT=$(node -p "require('./package.json').version")
          DRIP=$(node -p "require('./plugins/dripline/package.json').version")
          RUN=$(node -p "require('./plugins/runline/package.json').version")
          echo "root=$ROOT dripline=$DRIP runline=$RUN"
          if [ "$ROOT" != "$DRIP" ] || [ "$ROOT" != "$RUN" ]; then
            echo "::error::workspace versions are out of sync — refusing to publish"
            exit 1
          fi

      - name: Bump patch version (root + all plugins, in lockstep)
        run: |
          bun run scripts/bump-version.mjs patch
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION"

      - name: Verify versions still match after bump
        run: |
          ROOT=$(node -p "require('./package.json').version")
          DRIP=$(node -p "require('./plugins/dripline/package.json').version")
          RUN=$(node -p "require('./plugins/runline/package.json').version")
          echo "root=$ROOT dripline=$DRIP runline=$RUN"
          if [ "$ROOT" != "$DRIP" ] || [ "$ROOT" != "$RUN" ]; then
            echo "::error::post-bump version drift across workspaces"
            exit 1
          fi

      - name: Reinstall local package dependencies after the version bump
        run: bun install

      - name: Rebuild release artifacts
        run: bun run smoke

      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json bun.lock plugins/*/package.json
          git commit -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Prepare publish dependency versions
        run: bun run scripts/prepare-publish.mjs

      - name: Publish all workspaces to GitHub Packages
        run: |
          bun publish
          (cd plugins/dripline && bun publish)
          (cd plugins/runline && bun publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..v${VERSION} --pretty=format:"- %s" --no-merges | grep -v "^- release:")
          else
            NOTES=$(git log --pretty=format:"- %s" --no-merges | grep -v "^- release:")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "NOTES<<${EOF}" >> $GITHUB_ENV
          echo "${NOTES}" >> $GITHUB_ENV
          echo "${EOF}" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "${NOTES}" \
            --latest
